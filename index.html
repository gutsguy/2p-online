<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2인용 온라인</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1f1f1f; border-bottom: 1px solid #333; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #555; background: #2d6cdf; color: #fff; cursor: pointer; }
  button.secondary { background: #333; }
  button:disabled { opacity: .45; cursor: default; }
  #bar select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid #555; background: #000; color: #fff; }
  #bar input { font: inherit; width: 90px; padding: 5px 8px; border-radius: 6px; border: 1px solid #555; background: #000; color: #fff; text-transform: uppercase; }
  #status { margin-left: auto; color: #bbb; }
  #status.err { color: #ff8a8a; }
  #status.ok { color: #8fdc8f; }
  #game { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
  #picker { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #picker[hidden] { display: none; }
  #picker .box { max-width: 420px; text-align: center; background: #1b1b1b; border: 1px solid #333; border-radius: 10px; padding: 24px; }
  #picker p { margin: 0 0 16px; color: #ccc; }
  #picker code { color: #fff; }
  #picker .err { color: #ff8a8a; }
  #picker button { font-size: 16px; padding: 10px 18px; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, letterbox: "on",
    contextMenu: "rightClickOnly", allowScriptAccess: true, scale: "showAll", forceScale: true };
</script>
<script src="ruffle/ruffle.js"></script>
<script src="net.js"></script>
<script src="stage.js"></script>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <select id="kind" title="연결 방식"></select>
    <button id="host">방 만들기</button>
    <input id="code" placeholder="방 코드" maxlength="6">
    <button id="join">참가</button>
    <button id="again" class="secondary" hidden>다시 하기</button>
    <button id="pick" class="secondary" hidden>게임 파일 바꾸기</button>
    <span id="status">게임을 불러오는 중...</span>
  </div>
  <div id="game">
    <div id="picker" hidden>
      <div class="box">
        <p id="pickmsg">받은 게임 파일 <code>age-of-war-online.swf</code> 을 선택하세요.<br>한 번 고르면 이 브라우저가 기억합니다.</p>
        <button id="pickbtn">게임 파일 선택</button>
      </div>
    </div>
  </div>
  <input type="file" id="file" hidden>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var BUNDLED = "age-of-war-online.swf";   // present in the local folder, absent on the web site
  // connection method (see net.js): ?net=auto|webrtc|mqtt|local|relay, else last choice, else auto.
  // The relay lives in serve.py, so it is offered only when the page comes from serve.py (has a port).
  var ORDER = ["auto", "webrtc", "cf", "mqtt", "local", "relay"];
  var KINDS = AOWNet.kinds().filter(function (k) { return k !== "rejoin" && (k !== "relay" || location.port); })
    .sort(function (a, b) { return (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99; });
  var KIND = q.get("net");
  try { KIND = KIND || localStorage.getItem("aow-net2"); } catch (e) {}
  if (KINDS.indexOf(KIND) < 0) KIND = "auto";
  var $ = function (id) { return document.getElementById(id); };
  var status = function (t, cls) { var s = $("status"); s.textContent = t; s.className = cls || ""; };

  // ---- game file: bundled, remembered (IndexedDB), or picked by the user ----
  function db() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("aow-2p", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("files"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbDo(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var req = fn(d.transaction("files", mode).objectStore("files"));
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
  var saved = { get: function () { return dbDo("readonly", function (s) { return s.get("swf"); }); },
                put: function (b) { return dbDo("readwrite", function (s) { return s.put(b, "swf"); }); },
                del: function () { return dbDo("readwrite", function (s) { return s.delete("swf"); }); } };
  function isSwf(buf) {
    var b = new Uint8Array(buf, 0, Math.min(3, buf.byteLength));
    return b.length === 3 && (b[0] === 0x46 || b[0] === 0x43 || b[0] === 0x5A) && b[1] === 0x57 && b[2] === 0x53;
  }

  // short fingerprint of the game file, so two different files are caught before playing
  function tagOf(buf) {
    var u = new Uint8Array(buf), h = 2166136261;
    for (var i = 0; i < u.length; i++) { h ^= u[i]; h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16) + "-" + u.length;
  }

  var player = null, fromUser = false, readyTimer = null;
  // keep the original 650 x 450 shape whatever the window or device
  var RATIO = 650 / 450;
  function fit() {
    if (!player) return;
    var g = $("game"), w = g.clientWidth, h = g.clientHeight;
    if (w / h > RATIO) w = h * RATIO; else h = w / RATIO;
    player.style.width = Math.floor(w) + "px"; player.style.height = Math.floor(h) + "px";
  }
  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe($("game"));
  function showPicker(err) {
    $("picker").hidden = false;
    if (player) player.style.visibility = "hidden";
    $("pickmsg").innerHTML = (err ? '<span class="err">' + err + '</span><br><br>' : "") +
      '받은 게임 파일 <code>age-of-war-online.swf</code> 을 선택하세요.<br>한 번 고르면 이 브라우저가 기억합니다.';
    status("게임 파일이 필요합니다.");
  }
  function loadGame(src, user) {
    swfReady = false; fromUser = user;
    $("picker").hidden = true;
    $("pick").hidden = !user;
    status("게임을 불러오는 중...");
    if (!player) {
      player = window.RufflePlayer.newest().createPlayer();
      $("game").appendChild(player);
      window.player = player;
      fit();
      // a valid SWF that never says "ready" is not the 2-player mod
      player.addEventListener("loadeddata", function () {
        clearTimeout(readyTimer);
        readyTimer = setTimeout(function () {
          if (swfReady) return;
          if (fromUser) { saved.del(); showPicker("이 파일은 2인용 온라인 개조판이 아닌 것 같습니다."); }
          else status("게임이 응답하지 않습니다. 새로고침 해 보세요.", "err");
        }, 10000);
      });
    }
    player.style.visibility = "visible";
    var params = { mode: "online" };
    if (q.get("dbg")) params.dbg = q.get("dbg");
    var opts = { parameters: params };
    if (src.url) {
      opts.url = src.url; player.ruffle().load(opts);
      fetch(src.url).then(function (r) { return r.arrayBuffer(); }).then(function (b) { fileTag = tagOf(b); }).catch(function () {});
      return;
    }
    fileTag = tagOf(src.data);
    AOWStage.width(src.data, 650).then(function (b) { opts.data = new Uint8Array(b); player.ruffle().load(opts); });
  }
  function useFile(f) {
    if (!f) return;
    f.arrayBuffer().then(function (buf) {
      if (!isSwf(buf)) { showPicker("SWF 파일이 아닙니다. (" + f.name + ")"); return; }
      saved.put(buf);
      loadGame({ data: buf }, true);
    });
  }
  $("pickbtn").onclick = $("pick").onclick = function () { $("file").value = ""; $("file").click(); };
  $("file").onchange = function () { useFile(this.files[0]); };

  (q.has("pick") ? Promise.resolve(false) :
    fetch(BUNDLED, { method: "HEAD", cache: "no-store" })
      .then(function (r) { return r.ok && (r.headers.get("content-type") || "").indexOf("html") < 0; })
      .catch(function () { return false; })
  ).then(function (bundled) {
    if (bundled) { loadGame({ url: BUNDLED }, false); return; }
    return saved.get().then(function (buf) {
      if (buf && isSwf(buf)) loadGame({ data: buf }, true); else showPicker();
    });
  });

  var swfReady = false, net = null, role = null, room = null, playing = false;
  var lastSeen = 0, pingTimer = null;
  // PROTO: bump when the page <-> page messages change (both players need the same site version)
  var PROTO = 2, SID = Math.random().toString(36).slice(2, 10), fileTag = "";
  var guestSid = null;      // host: session id of the guest in the current game
  var peerLeft = false;     // the other side said goodbye (page closed / reloaded)
  // Game messages are numbered and kept until the other side confirms them (in its ping),
  // so nothing is lost or doubled when the connection drops and comes back.
  var outSeq = 0, outQ = [], inSeq = 0, held = {}, lastAsk = 0;
  var rejoin = null;        // reconnect in progress: { since, timer }
  var REJOIN_SEC = 120;

  var hole = 0;             // testing (?dbg): messages are dropped both ways until this time
  function sendRaw(t) { if (net && Date.now() >= hole) net.send(t); }
  function resetSeq() { outSeq = 0; outQ = []; inSeq = 0; held = {}; }
  function acked(n) { while (outQ.length && outQ[0][0] <= n) outQ.shift(); }
  function resend(n) { outQ.forEach(function (m) { if (m[0] > n) sendRaw("g" + m[0] + "|" + m[1]); }); }
  function askResend() { var t = Date.now(); if (t - lastAsk > 700) { lastAsk = t; sendRaw("Lr|" + inSeq); } }
  function deliver(s) { if (playing) player.aowRecv(s); }
  function onGame(t) {
    var i = t.indexOf("|"), n = Number(t.slice(1, i)), s = t.slice(i + 1);
    if (!(n > 0) || n <= inSeq) return;                      // duplicate
    if (n > inSeq + 1) { held[n] = s; askResend(); return; } // a gap: keep it, ask for the missing ones
    inSeq = n; deliver(s);
    while (held[inSeq + 1] !== undefined) { var x = held[inSeq + 1]; delete held[inSeq + 1]; inSeq++; deliver(x); }
  }

  // ---- SWF -> page ----
  window.aowSend = function (s) {
    outSeq++; outQ.push([outSeq, s]);
    if (outQ.length > 5000) outQ.shift();
    if (!rejoin) sendRaw("g" + outSeq + "|" + s);
  };
  window.aowEvent = function (e) {
    if (e === "ready") { swfReady = true; clearTimeout(readyTimer); if (!net) status("방을 만들거나 방 코드로 참가하세요."); return; }
    if (e.indexOf("end|") === 0) {
      playing = false;
      status(e === "end|win" ? "승리!" : "패배...", "ok");
      if (role === "H") $("again").hidden = false; else status($("status").textContent + " 방장이 다시 시작하면 이어집니다.", "ok");
    }
  };

  function pathText() {
    var path = net && net.path ? net.path() : null;
    return path === "direct" ? " · 직접 연결" : path ? " · 인터넷 중계" : "";
  }
  function startGame() {
    resetSeq(); peerLeft = false; stopRejoin();
    playing = true;
    $("again").hidden = true;
    var r = player.aowStart(role);
    status((role === "H" ? "게임 시작 (방장)" : "게임 시작 (참가자)") + pathText(), "ok");
    player.focus();
    return r;
  }

  var started = false, helloTimer = null, giveUpTimer = null;
  function hello() { sendRaw("Lhello|" + SID + "|" + PROTO + "|" + fileTag); }
  function onLobby(t) {
    var a = t.split("|"), k = a[0];
    if (k === "p") { acked(Number(a[1]) || 0); return; }
    if (k === "r") { var n = Number(a[1]) || 0; acked(n); resend(n); return; }
    if (k === "ping" || (k === "hello" && a.length < 4)) {   // the other page is an older version
      status("상대의 사이트가 옛날 버전입니다. 상대에게 새로고침(Ctrl+F5)을 부탁하세요.", "err");
      return;
    }
    if (k === "hello" && role === "H") {
      if (Number(a[2]) !== PROTO) { sendRaw("Lbad|proto"); status("상대의 사이트 버전이 다릅니다. 두 사람 모두 새로고침(Ctrl+F5) 해 주세요.", "err"); return; }
      if (a[3] !== fileTag) { sendRaw("Lbad|file"); status("두 사람의 게임 파일이 다릅니다. 같은 파일을 골라야 합니다.", "err"); return; }
      if (playing && a[1] === guestSid) return;    // repeated hello from the guest already in this game
      guestSid = a[1];                              // a new guest (or the same one after reloading): new game
      sendRaw("Lstart"); startGame();
    }
    else if (k === "start" && role === "G") { started = true; clearInterval(helloTimer); clearTimeout(giveUpTimer); startGame(); }
    else if (k === "bad" && role === "G") {
      clearInterval(helloTimer); clearTimeout(giveUpTimer);
      closeNet();
      status(a[1] === "file" ? "방장과 게임 파일이 다릅니다. 같은 파일을 골라 주세요." :
             "방장과 사이트 버전이 다릅니다. 두 사람 모두 새로고침(Ctrl+F5) 해 주세요.", "err");
      unlock();
    }
    else if (k === "bye") {
      peerLeft = true; playing = false; stopRejoin();
      if (role === "H") status("상대가 나갔습니다. 같은 방 코드로 다시 참가하면 새 게임이 시작됩니다.", "err");
      else { closeNet(); status("방장이 나갔습니다. 방장이 방을 다시 만들면 그 코드로 참가하세요.", "err"); unlock(); }
    }
  }
  function unlock() {
    $("host").disabled = $("join").disabled = $("code").disabled = $("kind").disabled = $("pick").disabled = false;
  }
  function closeNet() { var n = net; net = null; if (n) try { n.close(); } catch (e) {} }

  // ---- reconnect after a drop during a game ----
  // Both sides notice (connection closed, or nothing heard for a while) and meet again on the
  // internet relay with the same room code; the games keep running meanwhile.
  function rekind() { return KIND === "local" || KIND === "relay" ? KIND : "rejoin"; }
  function startRejoin() {
    if (rejoin) return;
    rejoin = { since: Date.now(), timer: null };
    tryRejoin();
  }
  function tryRejoin() {
    if (!rejoin) return;
    var left = REJOIN_SEC - Math.round((Date.now() - rejoin.since) / 1000);
    if (left <= 0) {
      stopRejoin(); closeNet(); playing = false;
      status("다시 연결하지 못했습니다. 방을 새로 만들거나 다시 참가해 주세요.", "err");
      unlock();
      return;
    }
    status("연결이 끊겼습니다. 다시 연결하는 중... (" + left + "초 남음)", "err");
    closeNet();
    net = openNet(rekind());
    rejoin.timer = setTimeout(tryRejoin, 15000);
  }
  function stopRejoin() { if (rejoin) { clearTimeout(rejoin.timer); rejoin = null; } }

  function openNet(kind) {
    var me = AOWNet.create(kind, room, role, {
      onOpen: function () {
        if (net !== me) return;
        lastSeen = Date.now();
        if (rejoin) { sendRaw("Lr|" + inSeq); return; }
        if (role === "H") { if (!playing) status("방 코드: " + room + "  — 상대가 참가하기를 기다리는 중...", "ok"); }
        else if (!started) {
          status("방 " + room + " 에 참가하는 중...");
          // repeat until the host answers (it may still be getting ready)
          hello();
          clearInterval(helloTimer);
          helloTimer = setInterval(function () { if (!started && net) hello(); }, 2000);
        }
      },
      onMessage: function (t) {
        if (net !== me || Date.now() < hole) return;
        lastSeen = Date.now();
        if (rejoin && playing) {
          stopRejoin();
          sendRaw("Lr|" + inSeq);
          status("다시 연결됐습니다" + pathText(), "ok");
        }
        if (t.charAt(0) === "g") onGame(t);
        else if (t.charAt(0) === "L") onLobby(t.slice(1));
      },
      onClose: function () {
        if (net !== me) return;
        if (playing && !peerLeft) { startRejoin(); return; }
        if (rejoin) return;
        // keep the room open for the guest (relays only: the old direct-connection id may still be taken)
        if (role === "H") { closeNet(); net = openNet(rekind()); return; }
        closeNet();
        if (!peerLeft) status("연결이 끊겼습니다.", "err");
        unlock();
      },
      onStatus: function (t, cls) { if (net === me && !rejoin) status(t, cls); }
    });
    return me;
  }

  function connect(asRole, code) {
    if (!swfReady) { status(player ? "아직 게임을 불러오는 중입니다." : "먼저 게임 파일을 선택하세요.", "err"); return; }
    closeNet(); stopRejoin();
    role = asRole; room = code; started = false; playing = false; peerLeft = false; guestSid = null;
    clearInterval(helloTimer); clearTimeout(giveUpTimer);
    $("host").disabled = $("join").disabled = true; $("code").disabled = true; $("kind").disabled = true;
    $("pick").disabled = true;
    if (role === "H") status("방 코드: " + room + "  — 상대가 참가하기를 기다리는 중...", "ok");
    else {
      status("방 " + room + " 에 연결하는 중...");
      // guest: give up (and let the player try again) if the game has not started in time
      giveUpTimer = setTimeout(function () {
        if (started) return;
        clearInterval(helloTimer);
        closeNet();
        status("방 " + room + " 에 연결하지 못했습니다. 방 코드를 확인하고 다시 참가해 보세요.", "err");
        unlock();
      }, 30000);
    }
    net = openNet(KIND);
    lastSeen = Date.now();
    clearInterval(pingTimer);
    pingTimer = setInterval(function () {
      if (!net) return;
      if (rejoin) { sendRaw("Lr|" + inSeq); return; }
      sendRaw("Lp|" + inSeq);   // also confirms the game messages received so far
      if (playing && !peerLeft && Date.now() - lastSeen > 8000) startRejoin();
    }, 1000);
  }

  function newCode() {
    var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "";
    for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  KINDS.forEach(function (k) {
    var o = document.createElement("option"); o.value = k; o.textContent = AOWNet.label(k);
    if (k === KIND) o.selected = true;
    $("kind").appendChild(o);
  });
  $("kind").onchange = function () {
    KIND = this.value;
    try { localStorage.setItem("aow-net2", KIND); } catch (e) {}
  };
  $("host").onclick = function () { var c = newCode(); $("code").value = c; connect("H", c); };
  $("join").onclick = function () {
    var c = $("code").value.trim().toUpperCase();
    if (!c) { status("방 코드를 입력하세요.", "err"); return; }
    connect("G", c);
  };
  $("code").onkeydown = function (e) { if (e.key === "Enter") $("join").click(); };
  $("again").onclick = function () { if (net && role === "H" && !peerLeft) { net.send("Lstart"); startGame(); } };
  // testing aid (?dbg=1): cut the connection silently for ms, or close it
  if (q.get("dbg")) window.aowTest = {
    blackhole: function (ms) { hole = Date.now() + ms; },
    drop: function () { var n = net; if (n) n.close(); if (n && n === net) setTimeout(function () { if (net === n && playing) startRejoin(); }, 0); },
    state: function () { return { playing: playing, rejoin: !!rejoin, outQ: outQ.length, inSeq: inSeq, outSeq: outSeq, path: net && net.path ? net.path() : null }; }
  };
  window.addEventListener("beforeunload", function () { if (net) net.send("Lbye"); });
})();
</script>
</body>
</html>
